<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Calvin and Hobbes Quotes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Random Calvin &amp; Hobbes Quotes</h1>
    <div id="quote-card" class="quote-card">
      <blockquote id="quote-text">Click the button to get a random quote!</blockquote>
      <p id="quote-character" class="character"></p>
    </div>
    <button id="random-btn" type="button">Get Random Quote</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
