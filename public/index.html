<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Calvin and Hobbes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Random Calvin &amp; Hobbes</h1>
      <nav class="nav-links">
        <a href="/docs.html">API Docs</a>
        <button id="theme-toggle" type="button" class="icon-btn" title="Toggle dark mode (D)">
          <span id="theme-icon">&#9789;</span>
        </button>
      </nav>
    </header>

    <div id="strip-card" class="strip-card">
      <div id="strip-loading" class="strip-loading">Loading comic strip...</div>
      <img id="strip-img" class="strip-img" alt="Calvin and Hobbes comic strip" hidden>
      <p id="strip-date" class="strip-date"></p>
      <p id="strip-error" class="strip-error" hidden></p>
    </div>

    <div class="actions">
      <button id="random-btn" type="button" title="Random strip (Space)">Random Strip</button>
      <button id="daily-btn" type="button" class="btn-secondary" title="Strip of the Day">Strip of the Day</button>
      <button id="fav-btn" type="button" class="btn-secondary icon-btn" title="Favorite (F)">&#9825;</button>
      <button id="share-btn" type="button" class="btn-secondary icon-btn" title="Share (S)">&#128279;</button>
    </div>

    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Search quotes... (press /)" maxlength="200" aria-label="Search quotes">
      <button id="search-btn" type="button">Search</button>
    </div>

    <div id="search-results" class="search-results" hidden></div>

    <div id="favorites-section" class="favorites-section" hidden>
      <h2>Your Favorites</h2>
      <div id="favorites-list" class="favorites-list"></div>
      <button id="show-fav-btn" type="button" class="btn-secondary">Show Favorites</button>
    </div>

    <footer class="footer">
      <p>
        Press <kbd>Space</kbd> for random &middot;
        <kbd>F</kbd> favorite &middot;
        <kbd>S</kbd> share &middot;
        <kbd>D</kbd> dark mode &middot;
        <kbd>/</kbd> search
      </p>
      <p class="embed-info">
        Embed: <code>&lt;iframe src="/api/widget" width="500" height="200"&gt;&lt;/iframe&gt;</code>
      </p>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
